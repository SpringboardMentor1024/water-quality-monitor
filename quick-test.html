<!DOCTYPE html>
<html>
<head>
    <title>Quick Stations Test</title>
</head>
<body>
    <h2>Stations API Test</h2>
    <button onclick="testStations()">Test Stations API</button>
    <div id="result"></div>

    <script>
        async function testStations() {
            const result = document.getElementById('result');
            result.innerHTML = 'Testing...';
            
            try {
                const response = await fetch('http://localhost:8000/api/stations');
                result.innerHTML = `
                    <h3>Response Status: ${response.status}</h3>
                    <pre>${await response.text()}</pre>
                `;
            } catch (error) {
                result.innerHTML = `<h3>Error: ${error.message}</h3>`;
            }
        }
        
        // Auto test on load
        testStations();
    </script>
</body>
</html>
